name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library
        run: pnpm --filter @musicserver/shared build

      - name: Generate Prisma client
        run: pnpm --filter @musicserver/server prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck (server)
        run: pnpm --filter @musicserver/server exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @musicserver/web exec tsc -b

      - name: Test (server)
        run: pnpm --filter @musicserver/server test

      - name: Build (server)
        run: pnpm --filter @musicserver/server build

      - name: Build (web)
        run: pnpm --filter @musicserver/web build
